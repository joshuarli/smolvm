[package]
name = "smolvm-swift-ffi"
version = "0.1.0"
edition = "2021"
description = "Stable C ABI for the smolvm embedded runtime"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smolvm = { path = "../.." }
smolvm-protocol = { path = "../smolvm-protocol", version = "1.7.4" }
